# Legacy sites: static crawls served read-only.
#   :80 -> division2.immigration.go.th        (site two, ~2.9 GB, not in git)
#   :81 -> admin-division2.immigration.go.th  (site one, in git)
#
# The crawl saved  page.php?x=1  as  page.php_q_x=1  (see tools/prepare.py),
# while the links inside the pages still say  page.php%3Fx=1.  The rewrite
# below maps one onto the other.
types_hash_max_size 4096;

server {
    listen 80;
    server_name _;
    root /sites/division2.immigration.go.th;
    index index.html;
    charset utf-8;

    rewrite ^(.*)\?(.*)$ $1_q_$2 last;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 81;
    server_name _;
    root /sites/admin-division2.immigration.go.th;
    index index.html;
    charset utf-8;

    rewrite ^(.*)\?(.*)$ $1_q_$2 last;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
